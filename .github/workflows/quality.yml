name: Quality checks

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check formatting
        run: mvn -pl backend spotless:check

      - name: Run Checkstyle
        run: mvn -pl backend org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check -Dcheckstyle.config.location=config/checkstyle/checkstyle.xml

      - name: Run tests and build
        run: mvn -pl backend verify

      - name: Upload backend build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attendance-backend
          path: backend/target/attendance-backend-*.jar
          if-no-files-found: error
          overwrite: true

  terminal:
    name: Terminal quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # JavaFX braucht eine Anzeige. Der Runner hat keine, deshalb Xvfb
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Check formatting
        run: mvn -pl terminal spotless:check

      - name: Run Checkstyle
        run: mvn -pl terminal org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check -Dcheckstyle.config.location=$PWD/backend/config/checkstyle/checkstyle.xml

      - name: Run tests and build
        run: xvfb-run -a mvn -pl terminal verify

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

      - name: Check formatting
        run: npm run format:check
        working-directory: frontend

      - name: Run TypeScript typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Run unit tests
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload frontend build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attendance-frontend
          path: frontend/dist/
          if-no-files-found: error
          overwrite: true
