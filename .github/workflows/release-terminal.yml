name: Release terminal Maven project

on:
  push:
    tags:
      - 'terminal-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Verify terminal Maven project
        run: |
          mvn -pl terminal spotless:check
          mvn -pl terminal org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check "-Dcheckstyle.config.location=${GITHUB_WORKSPACE}/backend/config/checkstyle/checkstyle.xml"
          xvfb-run -a mvn -pl terminal verify

      - name: Package terminal release
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#terminal-v}"
          RELEASE_DIRECTORY="terminal/target/attendance-terminal-${RELEASE_VERSION}"
          mkdir -p "$RELEASE_DIRECTORY/lib"
          cp terminal/target/attendance-terminal-*.jar "$RELEASE_DIRECTORY/attendance-terminal-${RELEASE_VERSION}.jar"
          mvn -pl terminal org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DincludeScope=runtime -DoutputDirectory="${GITHUB_WORKSPACE}/${RELEASE_DIRECTORY}/lib"
          cd terminal/target
          zip -r "attendance-terminal-${RELEASE_VERSION}.zip" "attendance-terminal-${RELEASE_VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "terminal/target/attendance-terminal-${GITHUB_REF_NAME#terminal-v}.zip" --generate-notes
