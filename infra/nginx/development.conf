server {
    listen 8444 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_client_certificate /etc/nginx/tls/terminal-client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /api/scans {
        proxy_pass http://host.docker.internal:8080/api/scans;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/tls/terminal-proxy.conf;
        proxy_set_header X-Terminal-Client-Verify $ssl_client_verify;
        proxy_set_header X-Terminal-Client-Subject $ssl_client_s_dn;
    }
}
