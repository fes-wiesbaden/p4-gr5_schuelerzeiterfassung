spring:
  application:
    name: attendance-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:attendance}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:attendance}
    password: ${DB_PASSWORD:local-development-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
